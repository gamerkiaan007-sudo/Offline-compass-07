name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'

    - name: Prepare Keystore and Environment
      run: |
        mkdir -p "$HOME/.android"
        keytool -genkey -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
        cp "$HOME/.android/debug.keystore" ./debug.keystore || true
        if [ ! -f ".env" ] && [ -f ".env.example" ]; then
          cp .env.example .env
        elif [ ! -f ".env" ]; then
          touch .env
        fi

    - name: Build with Gradle
      run: |
        gradle wrapper --gradle-version 8.11.1 || true
        gradle :app:assembleDebug --stacktrace --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: compass-app-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14

